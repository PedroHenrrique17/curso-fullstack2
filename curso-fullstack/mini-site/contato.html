<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/style.css">
  <title>MC Máquinas - contato</title>
</head>

<body>
  <div class="container">
    <header>
      <section class="contentHeader">
        <h1>MC - MÁQUINAS</h1>

        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
          </ul>
        </nav>
      </section>
    </header>

    <main class="contentMain paginaContato">
      <h1>Página Contato</h1>

      <section>
        <form id="meuFormulario">
          <article class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome">
          </article>

          <article class="form-group">
            <label for="telefone">Telefone</label>
            <input type="number" id="telefone">
          </article>

          <article class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email">
          </article>

          <article class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="m">Masculino</option>
              <option value="f">Feminino</option>
            </select>
          </article>
          
          <article class="form-group">
            <h1>Deseja receber informações</h1>
            <label for="s">Sim?</label>
            <input type="checkbox" id="s" />
          </article>
          
          <article class="form-group">
            <button type="submit">Enviar</button>
          </article>

          <article class="form-group">
            <p>Não tem cadastro clique aqui, <a href="cadastro.html">Cadastrar-se</a></p>
          </article>
        </form>
      </section>


      <!--Rodapé-->
      <footer>
        <p>@ 2026 MC - MÁQUINAS</p>
      </footer>

    </main>


  </div>

  <script src="./js/validacao.js"></script>
</body>


</html>
